name: Build and deploy Flutter web to Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "firebase.json"
      - "tools/firebase-cli/package*.json"
      - ".github/workflows/firebase-hosting.yml"

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check Hosting project configuration
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          FIREBASE_DEPLOY_SERVICE_ACCOUNT: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          : "${FIREBASE_PROJECT_ID:?Set the FIREBASE_PROJECT_ID repository variable}"
          : "${FIREBASE_WORKLOAD_IDENTITY_PROVIDER:?Set the FIREBASE_WORKLOAD_IDENTITY_PROVIDER repository variable}"
          : "${FIREBASE_DEPLOY_SERVICE_ACCOUNT:?Set the FIREBASE_DEPLOY_SERVICE_ACCOUNT repository variable}"

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.32.3"
          channel: stable

      - name: Resolve Flutter packages
        working-directory: frontend
        run: flutter pub get

      - name: Build production web app
        working-directory: frontend
        env:
          NANOPREDICT_API_BASE_URL: ${{ vars.NANOPREDICT_API_BASE_URL || 'https://nanopredict-lab-api-alihatab.vercel.app' }}
        run: >-
          flutter build web --release
          --pwa-strategy=none
          --no-web-resources-cdn
          --dart-define="NANOPREDICT_API_BASE_URL=$NANOPREDICT_API_BASE_URL"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install pinned Firebase CLI
        run: npm ci --prefix tools/firebase-cli

      # Authenticate after the build so the short-lived credential is fresh.
      - name: Authenticate to Firebase
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - name: Ensure NanoPredict Lab Hosting site exists
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          FIREBASE_BIN=./tools/firebase-cli/node_modules/.bin/firebase
          if ! "$FIREBASE_BIN" hosting:sites:get nanopredict-lab --project "$FIREBASE_PROJECT_ID" --json >/dev/null 2>&1; then
            "$FIREBASE_BIN" hosting:sites:create nanopredict-lab --project "$FIREBASE_PROJECT_ID" --non-interactive
          fi

      - name: Deploy live Hosting site
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: >-
          ./tools/firebase-cli/node_modules/.bin/firebase deploy --only hosting
          --project "$FIREBASE_PROJECT_ID" --non-interactive
          --message "GitHub main ${GITHUB_SHA}"
