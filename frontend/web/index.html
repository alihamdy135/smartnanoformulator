<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="$FLUTTER_BASE_HREF" />
    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Evidence-guided nanopharmaceutical formulation design and microfluidic liposome process assessment." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7f2" />
    <title>NanoPredict Lab</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body>
    <script>
      (async () => {
        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          if ('caches' in window) {
            const storedCaches = await caches.keys();
            await Promise.all(storedCaches.map((name) => caches.delete(name)));
          }
        } catch (error) {
          console.warn('Could not clear an older offline app cache:', error);
        }

        const bootstrap = document.createElement('script');
        bootstrap.src = `flutter_bootstrap.js?v=${Date.now()}`;
        bootstrap.async = true;
        document.body.appendChild(bootstrap);
      })();
    </script>
  </body>
</html>
